services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api

    env_file:
      - .env

    ports:
      - "8001:8000"


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit

    environment:
      API_BASE_URL: http://api:8000

    ports:
      - "8501:8501"

    depends_on:
      - api